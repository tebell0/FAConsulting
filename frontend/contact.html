<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Me</title>

      <!-- Universal group CSS -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="index.css" />
  <style>
    /* TEMPORARY CSS FOR TESTING
       Once my group and I combine our work, 
       move the .error class into the universal CSS file */
    .error {
      color: red;
      font-size: 0.9rem;
      display: block;
      margin-bottom: 10px;
    }
  </style>
</head>

<body>

  <div id="header">
    <h1>Contact Me</h1>
    <p>
      Please fill out this form with as much detail as possible!
    </p>
  </div>

  <form id="contactForm" action="closingpage.html" novalidate>

    <h3>Personal & Contact Information</h3>

    <label>First Name:</label>
    <input type="text" id="first_name" placeholder="First Name">
    <small class="error" id="firstNameError"></small>

    <label>Last Name:</label>
    <input type="text" id="last_name" placeholder="Last Name">
    <small class="error" id="lastNameError"></small>

    <label>Date of Birth:</label>
    <input type="text" id="dob" placeholder="MM/DD/YYYY">
    <small class="error" id="dobError"></small>

    <label>Phone:</label>
    <input type="text" id="phone" placeholder="XXX-XXX-XXXX">
    <small class="error" id="phoneError"></small>

    <label>Email:</label>
    <input type="text" id="email" placeholder="Email Address">
    <small class="error" id="emailError"></small>

    <h3>Inquiry Details</h3>

    <label>Type of Inquiry:</label>
    <select id="inquiry_type">
      <option value="">Select an option</option>
      <option value="reschedule">Reschedule appointment</option>
      <option value="billing">Billing question</option>
      <option value="additional">Additional info</option>
      <option value="location">Change location</option>
      <option value="delivery">Haven't received product</option>
      <option value="other">Other</option>
    </select>
    <small class="error" id="inquiryError"></small>

    <label>Message:</label>
    <textarea id="message" placeholder="Enter your message"></textarea>
    <small class="error" id="messageError"></small>

    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

  </form>

  <script>
    const form = document.getElementById("contactForm");

    form.addEventListener("submit", function (event) {
      let isValid = true;

      clearErrors();

      const firstName = document.getElementById("first_name").value.trim();
      const lastName = document.getElementById("last_name").value.trim();
      const dob = document.getElementById("dob").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const email = document.getElementById("email").value.trim();
      const inquiry = document.getElementById("inquiry_type").value;
      const message = document.getElementById("message").value.trim();

      if (firstName === "") {
        document.getElementById("firstNameError").textContent = "First name is required.";
        isValid = false;
      }

      if (lastName === "") {
        document.getElementById("lastNameError").textContent = "Last name is required.";
        isValid = false;
      }

      const dobPattern = /^(0[1-9]|1[0-2])\/(0[1-9]|[12][0-9]|3[01])\/\d{4}$/;
      if (dob === "") {
        document.getElementById("dobError").textContent = "DOB is required.";
        isValid = false;
      } else if (!dobPattern.test(dob)) {
        document.getElementById("dobError").textContent = "Use MM/DD/YYYY format.";
        isValid = false;
      }

      const phonePattern = /^\d{3}-\d{3}-\d{4}$/;
      if (phone === "") {
        document.getElementById("phoneError").textContent = "Phone is required.";
        isValid = false;
      } else if (!phonePattern.test(phone)) {
        document.getElementById("phoneError").textContent = "Use XXX-XXX-XXXX.";
        isValid = false;
      }

      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (email === "") {
        document.getElementById("emailError").textContent = "Email is required.";
        isValid = false;
      } else if (!emailPattern.test(email)) {
        document.getElementById("emailError").textContent = "Invalid email.";
        isValid = false;
      }

      if (inquiry === "") {
        document.getElementById("inquiryError").textContent = "Select an inquiry type.";
        isValid = false;
      }

      if (message === "") {
        document.getElementById("messageError").textContent = "Message is required.";
        isValid = false;
      } else if (message.length < 10) {
        document.getElementById("messageError").textContent = "At least 10 characters.";
        isValid = false;
      }

      if (!isValid) {
        event.preventDefault();
      }
    });

    function clearErrors() {
      document.querySelectorAll(".error").forEach(e => e.textContent = "");
    }
  </script>

</body>
</html>
